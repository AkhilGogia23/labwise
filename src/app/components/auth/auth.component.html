<div class="p-6 max-w-md mx-auto">
  <div class="flex justify-end">
    <button mat-icon-button (click)="dialogRef.close()"><mat-icon>close</mat-icon></button>
  </div>

  <h2 class="text-2xl font-bold text-center mb-6 text-[#1F2833] dark:text-[#66FCF1]">
    {{ isLogin ? 'Welcome Back' : 'Join LabWise' }}
  </h2>

  <form #f="ngForm" (ngSubmit)="submit()" class="space-y-5">
    <mat-form-field appearance="outline" class="w-full" *ngIf="!isLogin">
      <mat-label>Full Name</mat-label>
      <input matInput [(ngModel)]="name" name="name" required #nameCtrl="ngModel">
      <mat-icon matSuffix class="text-gray-400">person</mat-icon>
      <mat-error *ngIf="nameCtrl.invalid && nameCtrl.touched">Name required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Email</mat-label>
      <input matInput type="email" [(ngModel)]="email" name="email" required email>
      <mat-icon matSuffix class="text-gray-400">email</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Password</mat-label>
      <input matInput [type]="hide ? 'password' : 'text'" [(ngModel)]="pass" name="pass" required minlength="6">
      <button mat-icon-button matSuffix (click)="hide = !hide" type="button">
        <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>

    <button mat-raised-button color="primary" class="w-full h-12 text-lg font-semibold"
            [disabled]="f.invalid">
      {{ isLogin ? 'Sign In' : 'Create Account' }}
    </button>
  </form>

  <p class="text-center mt-4 text-sm text-gray-600 dark:text-gray-400">
    {{ isLogin ? "Don't have an account?" : "Already have an account?" }}
    <a (click)="isLogin = !isLogin" class="text-[#45A29E] dark:text-[#66FCF1] font-medium cursor-pointer hover:underline">
      {{ isLogin ? 'Sign Up' : 'Sign In' }}
    </a>
  </p>
</div>

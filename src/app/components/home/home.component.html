<div class="hero min-h-screen flex items-center justify-center relative overflow-hidden">
  <!-- Background Image -->
  <div class="absolute inset-0 z-0">
  
    <!-- Dark Overlay for Text Readability -->
    <div class="absolute inset-0 bg-gradient-to-br from-blue-900/70 via-black/50 to-green-900/70"></div>
  </div>

  <!-- Content (on top) -->
  <div class="relative z-10 max-w-4xl w-full px-6 text-center text-white">
    <h1 class="text-5xl md:text-7xl font-bold mb-6 leading-tight drop-shadow-lg">
      Find the Right Test.<br><span class="text-green-400">At the Best Price.</span>
    </h1>

    <p class="text-xl md:text-2xl mb-10 drop-shadow-md">
      Compare 100+ NABL labs • Book in 30 seconds • Save up to 50%
    </p>

    <!-- Search Card -->
    <div class="bg-white/95 dark:bg-gray-800/95 backdrop-blur-sm rounded-3xl shadow-2xl p-8 max-w-3xl mx-auto">
      <div class="grid md:grid-cols-3 gap-4">
        <mat-form-field appearance="fill" class="w-full">
          <mat-label class="text-gray-700 dark:text-gray-300">Search Test or Lab</mat-label>
          <input 
            matInput 
            [(ngModel)]="searchQuery" 
            placeholder="Blood Test, MRI, City Diagnostics"
            class="text-gray-900 dark:text-white"
            (keyup.enter)="search()"
          >
        </mat-form-field>

        <mat-form-field appearance="fill" class="w-full">
          <mat-label class="text-gray-700 dark:text-gray-300">City</mat-label>
          <mat-select [(ngModel)]="city">
            <mat-option *ngFor="let c of cities" [value]="c">{{c}}</mat-option>
          </mat-select>
        </mat-form-field>

        <button 
          mat-raised-button 
          color="accent" 
          class="h-14 text-lg font-semibold"
          (click)="search()"
        >
          Search Now
        </button>
      </div>
    </div>

    <p class="mt-8 text-lg drop-shadow">
      Trusted by <strong>50,000+</strong> patients across India
    </p>
  </div>
</div>

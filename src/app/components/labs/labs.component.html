<div class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-green-50 
            dark:from-gray-900 dark:via-gray-800 dark:to-gray-900 py-12 pt-24">

  <!-- Header -->
  <div class="max-w-7xl mx-auto px-6 text-center mb-10">
    <h1 class="text-4xl md:text-5xl font-bold text-primary dark:text-blue-300 mb-3">
      Discover Labs Near You
    </h1>
    <p class="text-lg text-gray-600 dark:text-gray-300">
      {{ labs.length }} trusted diagnostic centers in Mumbai • NABL, ISO & CAP accredited
    </p>
  </div>

  <!-- Map + Cards -->
  <div class="max-w-7xl mx-auto px-6">
    <!-- Map -->
    <div class="h-96 rounded-3xl overflow-hidden shadow-2xl mb-10 border border-gray-200 dark:border-gray-700">
      <google-map [options]="mapOptions" width="100%" height="100%">
        <map-marker 
          *ngFor="let lab of labs" 
          [position]="lab.location" 
          [title]="lab.name"
          [label]="{ text: lab.rating.toString(), color: 'white', fontWeight: 'bold' }"
          [icon]="'https://maps.google.com/mapfiles/ms/icons/green-dot.png'"
          (mapClick)="viewDetails(lab.id)">
        </map-marker>
      </google-map>
    </div>

    <!-- Lab Cards Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <mat-card 
        *ngFor="let lab of labs; let i = index"
        class="bg-white/95 dark:bg-gray-800/95 backdrop-blur-sm rounded-2xl shadow-lg 
               hover:shadow-2xl transition-all duration-300 hover:scale-[1.02] 
               border border-gray-100 dark:border-gray-700"
      >
        <mat-card-header class="pb-3">
          <mat-card-title class="text-xl font-bold text-primary dark:text-white flex items-center justify-between">
            {{ lab.name }}
            <span class="text-xs bg-green-100 dark:bg-green-900 text-green-800 dark:text-green-200 px-2 py-1 rounded-full">
              {{ lab.accreditation }}
            </span>
          </mat-card-title>
          <mat-card-subtitle class="flex items-center gap-1 text-yellow-600 dark:text-yellow-400">
            ⭐ {{ lab.rating }} • {{ lab.testsCount }} tests
          </mat-card-subtitle>
        </mat-card-header>

        <mat-card-content class="space-y-2">
          <p class="text-gray-600 dark:text-gray-300">
            📍 {{ lab.address }}, {{ lab.city }}
          </p>
          <p class="text-sm text-accent font-medium">
            {{ lab.distance }} km away
          </p>
        </mat-card-content>

        <mat-card-actions class="p-4">
          <button 
            mat-raised-button 
            color="accent" 
            class="w-full font-semibold"
            (click)="viewDetails(lab.id)"
          >
            View Details
          </button>
        </mat-card-actions>
      </mat-card>
    </div>
  </div>
</div>

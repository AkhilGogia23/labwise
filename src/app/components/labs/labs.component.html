<div class="p-4">
  <h2 class="text-2xl">Discover Labs Near You</h2>
  <google-map [options]="mapOptions">
    <map-marker *ngFor="let lab of labs" [position]="lab.location" [title]="lab.name" (mapClick)="viewDetails(lab.id)"></map-marker>
  </google-map>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
    <mat-card *ngFor="let lab of labs" class="hover:shadow-lg transition">
      <mat-card-header>
        <mat-card-title>{{lab.name}}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p>{{lab.address}}, {{lab.city}}</p>
        <p>Rating: {{lab.rating}} ⭐</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button (click)="viewDetails(lab.id)">Details</button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
